/* v2.2.8 - restrained physical-card tilt and light glint, on visible artwork only */
.hand-card .card-picture, .library-card .card-picture {
  position:relative;
  isolation:isolate;
  transform-style:preserve-3d;
  transform:perspective(850px) rotateX(0deg) rotateY(0deg);
  transition:transform 230ms cubic-bezier(.22,.7,.3,1), filter 230ms ease;
  will-change:auto;
}
.hand-card .card-picture::after, .library-card .card-picture::after {
  content:"";
  position:absolute;
  inset:0;
  z-index:3;
  border-radius:inherit;
  pointer-events:none;
  opacity:0;
  background:radial-gradient(ellipse 68% 48% at var(--glint-x,50%) var(--glint-y,50%),rgba(255,251,227,.26) 0%,rgba(255,244,202,.10) 45%,transparent 83%);
  mix-blend-mode:screen;
  transition:opacity 230ms ease;
}
.hand-card .card-picture.card-touch, .library-card .card-picture.card-touch {
  transform:perspective(850px) translate3d(var(--push-x,0px),var(--push-y,0px),0) rotateX(var(--tilt-x,0deg)) rotateY(var(--tilt-y,0deg)) scale(1.014);
  filter:brightness(1.045);
  transition:transform 95ms ease-out,filter 180ms ease;
}
.hand-card .card-picture.card-touch::after, .library-card .card-picture.card-touch::after {opacity:.7}
.dragging-card .hand-card .card-picture,
.hand-card.dragging .card-picture {transform:none!important;filter:none!important}
.dragging-card .hand-card .card-picture::after,
.hand-card.dragging .card-picture::after {opacity:0!important}
@media (prefers-reduced-motion:reduce) {
  .hand-card .card-picture, .library-card .card-picture {transition:none!important;transform:none!important;filter:none!important}
  .hand-card .card-picture::after, .library-card .card-picture::after {display:none!important}
}

</style></head><body><div id="app"></div><div id="toast" class="notification hidden"></div><div id="hover-card-preview" aria-hidden="true"></div><script>
'use strict';
/*
 LEGEND CARD MANAGER 2.0 — MAINTAINER NOTES
 --------------------------------------------------------------
 Single standalone offline HTML. No external CSS/JS, servers, or Python.
 Persistent storage: IndexedDB "legend-card-manager-v1" (deliberately
 unchanged for backward compatibility); data / images / packImages stores.
 Backup: JSON {version:1,state,images,packImages}. Keep import compatible.

 CORE RULES — KEEP THESE BEHAVIORS:
 • Ordinary normal cards have at most ONE pool slot per definition.
   Library-to-player drag/drop can mint extra HAND instances. Returning
   copies never duplicates the pool definition.
 • Cursed and Blessed cards are repeatable. Cursed uses a global deck.
 • Standard pack: 5 options / at least 9 available normal cards.
   Premium: at least 9 available and 3 eligible Rare.
   Cursed set pack: 5 non-Rare set cards + 1 global Cursed; award both
   the Cursed card and the player's choice of one normal card.
 • Golden: 5 global Rare (49 available needed, small Blessed chance);
   Cursed Golden: 5 global Rare + 1 global Cursed, award both picks.
 • No automatic LP spending. Preserve cost overrides and X-cost.
 • Pack selection requires flipping EVERY card. Finish rip animation
   before revealing the choice grid.
 • Cardbacks: <set>_cb.png; mechanic and Golden pack cover images use
   explicit PACK_IMAGE_BY_MECHANIC / VALID_PACK_IMAGE_STEMS mappings.
 • Preserve hand order, hover previews, drag/drop, filter/list UI, Undo.
 • Log and Undo belong to the current session, not the saved backup.

 Source sections: state, persistence, rules, views, modals,
 imports/backups, events, and physical-card interactions.
 --------------------------------------------------------------
*/
// ===== 1. STATE & UTILITIES =====
const initial=()=>({cards:[],trueWords:[],customEffects:[],customCards:[],elixirs:[],players:[],order:0});let state=initial(),screen='hands',selectedPlayer=null,selectedCard=null,modal=null,search='',filterSet='',db=null,images=new Map();let saveQueued=Promise.resolve(),packImages=new Map(),shopScope='all',shopGroup=null,handView='cards',libraryView='cards',selectedLibraryCard=null,handTab='cards',selectedTrueWord=null;let librarySearchTimer=null;let librarySortKey='',librarySortDirection='asc',libraryPoolOnly=false,libraryMissingImagesOnly=false,filterMechanic="";
// Undo history is in memory only: never persisted to IndexedDB or JSON backups.
let undoStack=[]; let pendingPackReveal=null; let sessionLog=[];
const id=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function norm(s){const special={'þ':'th','ð':'d','đ':'d','æ':'ae','œ':'oe','ø':'o','ł':'l','ħ':'h','ı':'i','ß':'ss','ŋ':'n','ĸ':'k','ŧ':'t'};return String(s??'').toLowerCase().replace(/[þðđæœøłħıßŋĸŧ]/g,ch=>special[ch]).normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');}
// Square-bracket annotations are metadata: searchable, but not rendered in card text.
function visibleText(value){return String(value??'').replace(/\[[^\]\r\n]*\]/g,'').replace(/[ \t]{2,}/g,' ').replace(/^[ \t]+|[ \t]+$/gm,'').trim()}
// Search works across all card metadata. Comma/semicolon separated terms must ALL appear.
function searchTerms(query){return String(query||'').split(/[,;]/).map(term=>norm(term)).filter(Boolean)}
function cardMatchesQuery(card,query){
 const terms=searchTerms(query);
 if(!terms.length)return true;
 const haystack=norm([card.name,card.set,card.cost,card.rarity,card.mechanicPack,card.text].join(' '));
 return terms.every(term=>haystack.includes(term));
}
const libraryColumns=[['name','Kart'],['set','Set'],['cost','Cost'],['rarity','Rarity'],['mechanicPack','Mechanic Pack'],['text','Metin'],['status','Durum']];
function librarySortHeader(key,label){let selected=librarySortKey===key;return `<button type="button" class="sort-column ${selected?'sort-on':''}" data-sort="${esc(key)}" title="${esc(label)} sütununa göre sırala; tekrar tıklayarak yönü değiştir" aria-label="${esc(label)} sıralama: ${selected?(librarySortDirection==='asc'?'artan':'azalan'):'kapalı'}">${esc(label)} <span aria-hidden="true">${selected?(librarySortDirection==='asc'?'▲':'▼'):'↕'}</span></button>`}
function compareNatural(a,b){return String(a??'').localeCompare(String(b??''),'tr',{numeric:true,sensitivity:'base'})}
function sortValue(card,key){if(key==='text')return visibleText(card.text);if(key==='status')return ownerNames(card).length?'Elde: '+ownerNames(card).join(', '):'Havuzda';return card[key]??''}
function sortedLibraryCards(cards){if(!librarySortKey)return cards;const key=librarySortKey,dir=librarySortDirection==='asc'?1:-1;return [...cards].sort((a,b)=>{
 if(key==='cost'){
  const na=Number(String(a.cost??'').replace(',','.')),nb=Number(String(b.cost??'').replace(',','.'));
  if(String(a.cost??'').trim()!==''&&String(b.cost??'').trim()!==''&&Number.isFinite(na)&&Number.isFinite(nb)&&na!==nb)return (na-nb)*dir;
 }
 const result=compareNatural(sortValue(a,key),sortValue(b,key));return result?result*dir:compareNatural(a.name,b.name)
})}
function toast(msg){let e=document.getElementById('toast');e.textContent=msg;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),3500)}
// ===== 2. PERSISTENCE & UNDO =====
const tx=(store,mode='readonly')=>db.transaction(store,mode).objectStore(store);
const request=p=>new Promise((ok,no)=>{p.onsuccess=()=>ok(p.result);p.onerror=()=>no(p.error)});
// V2 persistence: retain the v1 database name, schema and JSON backup format.
// Read artwork in batches instead of opening a fresh transaction for every image.
async function loadAssetStore(store, destination, validIds=null){
 const [keys, blobs]=await Promise.all([
  request(tx(store).getAllKeys()), request(tx(store).getAll())
 ]);
 for(let i=0;i<keys.length;i++){
  if(validIds&&!validIds.has(keys[i]))continue;
  if(blobs[i])destination.set(keys[i],URL.createObjectURL(blobs[i]));
 }
}
async function openDB(){
 db=await new Promise((ok,no)=>{
  const r=indexedDB.open('legend-card-manager-v1',2);
  r.onupgradeneeded=()=>{
   for(const n of ['data','images','packImages'])if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n);
  };
  r.onsuccess=()=>ok(r.result);
  r.onerror=()=>no(r.error);
 });
 state=await request(tx('data').get('state'))||initial();
 state.cards??=[];state.trueWords??=[];state.customEffects??=[];state.customCards??=[];state.elixirs??=[];state.players??=[];state.order??=0;for(const p of state.players)p.trueWords??=[];
 await Promise.all([
  loadAssetStore('images',images,new Set(state.cards.map(c=>c.id))),
  loadAssetStore('packImages',packImages)
 ]);
}

function save(){
 // Capture the state at call-time, not after an async queue turn; avoids overwriting
 // a newer edit with a stale queued snapshot.
 const snapshot=structuredClone(state);
 saveQueued=saveQueued.catch(err=>{console.error('Önceki kayıt işlemi başarısız:',err)}).then(()=>request(tx('data','readwrite').put(snapshot,'state')));
 return saveQueued;
}
// Capture state before each user-visible mutation; undo restores the snapshot and UI context.
function captureUndo(label,context={}){return {label,state:structuredClone(state),screen,selectedPlayer,selectedCard,selectedLibraryCard,modal:structuredClone(modal),context,assets:[],logLength:sessionLog.length}}
function logAction(message){sessionLog.push({time:new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),message});if(screen==='log'&&!modal)render()}
async function deletePlayerWithLog(p){
 if(!p)return;
 pushUndo(captureUndo('Oyuncu silme'));
 for(const h of sortedHand(p)){
  const c=cardBy(h.cardId);
  if(c){
   logAction(c.custom?`${p.name} silindi: ${c.name} custom kartı yok edildi.`:c.cursed?`${p.name} silindi: ${c.name} cursed kartı elinden kaldırıldı.`:`${p.name} silindi: ${c.name} kartı havuza döndü.`);
  }
 }
 logAction(`${p.name} oyuncusu silindi (${p.hand.length} kart).`);
 const orphaned=new Set(p.hand.filter(h=>cardBy(h.cardId)?.custom).map(h=>h.cardId));
 state.players=state.players.filter(x=>x.id!==p.id);
 for(const cid of orphaned)if(!state.players.some(other=>other.hand.some(h=>h.cardId===cid)))state.customCards=state.customCards.filter(c=>c.id!==cid);
 if(selectedPlayer===p.id){selectedPlayer=state.players[0]?.id||null;selectedCard=null}
 await save();render();
}
function rulesPage(){return `<div class="rules-head"><h2>📖 Kurallar</h2></div><div class="rules-layout"><div class="rules-illustration" aria-hidden="true">${mascotImage('card_info')}</div><div class="rules-content"><section class="rules-section" id="rules-section-0"><h2>Legend Point Kart Sistemi</h2><p>Gel bakalım kuzum, otur şöyle yanıma. Şimdi sana bu güzelim kartların nasıl kullanıldığını bir güzel anlatayım. Kulaklarını aç da dinle, sonra gelip de &quot;Cardmaker Teyzeciğim, ben bilmiyordum!&quot; deme bana!</p><h3>Legend Point nasıl kazanılır?</h3><p>Evladım, oyunda öyle sıradan işler yaparak efsane olunmaz. Şöyle dillere destan bir şeyler yapacaksın! Unutulmayacak bir kahramanlık olur, tehlikeli bir macera olur, masadaki herkesin eğlencesine eğlence katacak bir marifet olur... İşte o zaman Legend Point kazanırsın, kuzum!</p><h3>Peki, bu puanlarla ne yapacağız?</h3><ul class="rules-list"><li><strong>1 Legend Point</strong> harcayıp atacağın bir d20 zarına avantaj ablabilirsin.</li><li><strong>1 Legend Point</strong> harcayıp bir kart çekebilirsin. Hem de benim kendi ellerimle hazırladığım kartlardan! Ay, ne güzel!</li><li>Her kartı kullanmanın da kendine göre bir LP bedeli var, bu bedel kartın sol üst köşesinde yazıyor.</li></ul><h3>Kart alışverişi nasıl oluyor?</h3><p>Bak şimdi canım, elindeki kartları diğer oyuncularla takas edebilirsin. Ama öyle hayrına kart dağıtmak yok! Vereceksen karşılığında bir kart alacaksın. Onun dışında dükkandan Card Pack açabilirsin, açtığın packten bir kart senin olur.</p><p>Bir de kart çekme ve takas etme işlerini yalnızca oyun oturumunun başında veya sonunda yapabilirsiniz. Oyun ortasında pazarı kurmayın bana, hadi bakalım!</p><h3>Kartları ne zaman kullanabilirim?</h3><p>İşte burası güzel, evladım! Kartlarını oyun sırasında istediğin zaman kullanabilirsin. Hatta sıra başka bir oyuncudayken bile! Ama arkadaşlarının da tadını kaçırma, olur mu kuzum?</p><h3>Kullandığım kartlara ne oluyor?</h3><p>Kullandığın kartlar desteye gider, kuzum. Ama üzülme, sonra yeniden çekilebilirler.</p><h3>Şu kartların renkleri ne anlama geliyor?</h3><ul class="rules-list"><li><strong>Mor çerçeveli kartlar:</strong> Bunlar Common kartlarımız, canım. Sık sık karşına çıkarlar. Ama sakın değersiz sanma, hepsi benim gözümün nuru!</li><li><strong>Altın çerçeveli kartlar:</strong> Aaaah, işte bunlar Rare kartlarımız! Öyle her yerde bulunmazlar. Kıymetini bil yavrum, kıymetini!</li><li><strong>Beyaz Çerçeveli kartlar:</strong> Bunlar Blessed cartlar canım, tanrıların (ya da benim, keh keh) kutsamama sahip olduğunuzu gösterirler!</li><li><strong>Kırmızı Çerçeveli Kartlar:</strong> Cursed kartlar... Bunlar kötü etkiler barındırırlar, canım. Uzak durun demek istemem ama her ananın en sevdiği yavrusu, bir de... en az sevdiği yavrusu olur.</li></ul></section><section class="rules-section" id="rules-section-1"><h2>Cursed Cards</h2><p>Bak şimdi kuzum, bazen attığın zar yüzüne gülmez, insanın bütün hevesi kaçar. Ama istersen bir Cursed kart çekip sonucunu beğenmediğin d20&#x27;yi bir daha atabilirsin! Ne güzel, değil mi? Ama eğer zarına 1 attıysan, o zaman iki tane Cursee card çekmen gerekiyor.</p><p>Tabii her güzel şeyin bir bedeli var evladım... Bu pazarlığı her oyuncu, her Encounter&#x27;da yalnızca bir kez yapabilir. Şeytanla da öyle habire pazarlık edilmez, sonra yüz bulur!</p><h3>Drawing Cards</h3><p>Cursed kartların kendilerine ait ayrı bir destesi var, yavrum. Bunlar öyle normal Legend Point kartlarının arasından çıkmaz.</p><h3>Trading</h3><p>Aman kuzum, Cursed kartlarını başka oyuncularla ne takas edebilirsin ne de birine hediye edebilirsin. Öyle başına gelen musibeti komşunun kapısına bırakmak yok!</p><h3>Lanetten Kurtulmak</h3><p>Şimdi yavrum, bu lanetlerden kurtulmanın da bir yolu var elbet. Cursed kartını diğer kartlar gibi oynayıp elinden çıkarabilirsin. Ama dikkat et, kartı çektiğin Encounter sırasında kullanamazsın!</p><p>Ha, bir de kart attıran etkilerle Cursed kartlarını elinden çıkarabilirsin. Bak, gördün mü? Her derdin bir çaresi var!</p><h3>Sonsuz Lanetler</h3><p>Common ve Rare kartların sayısı bellidir kuzum, ama Cursed kartların öyle değil! Bunlardan sonsuz tane var. Aynı lanet bir kere gelir, iki kere gelir, üç kere gelir... Ayol, kapıyı kapatsan bacadan girer! O yüzden aynı Cursed kartı defalarca çekebilirsin.</p></section><section class="rules-section" id="rules-section-2"><h2>Blessed Card Rules</h2><h3>Blessed Kartlar Nasıl Kazanılır?</h3><p>Aaah, benim güzel kuzum! Blessed kartlar öyle sıradan kartlar değildir. 1 Legend Point karşılığında kart çekerken karşına çıkabilirler, paketlerden bulabilirsin, hatta oyunda yaptığın güzel bir işin karşılığında sana bahşedilebilirler. Demek ki bazen talih de insanın yüzüne gülüyormuş!</p><h3>Blessed Kartların Nadirliği</h3><p>Bak evladım, Blessed kartlar benim en nadide yavrularımdır! Bütün kartlar arasında en zor bulunanları bunlar. Normal kart çekerken bir Blessed bulma ihtimalin yalnızca %2!</p><p>Ama sakın uyanıklık edip kart çektiren başka kartlarla Blessed aramaya kalkma! Olmaz öyle şey! Blessed kart yalnızca Legend Point harcayarak doğrudan kart çektiğinde karşına çıkabilir.</p><h3>Paketlerdeki Blessed Kartlar</h3><p>Blessed kartları, Rare veya Mechanic Pack&#x27;lerde de bulabilirsin yavrum.</p><p>Her Mechanic&#x27;in kendine ait bir Blessed kartı bulunur. Üstelik o Mechanic&#x27;teki her 50 kart için bir Blessed kart daha eklenir! Bereket dediğin böyle olur işte. Maşallah!</p><h3>Bir Kutsama</h3><p>Şimdi kuzum, insanın gözü gönlü tok olacak. Her oyuncu yalnızca bir Blessed kart taşıyabilir. Yeni bir Blessed çekersen sadece birini tutabilirsin.</p><h3>Blessed Kartlar Neden Kaybolur?</h3><p>Ah yavrum ah... Güzel şeyler ne yazık ki pek uzun kalmıyor bu dünyada. Blessed kartlar da öyle.</p><p>Cursed kart çekersen Blessed kartın seni terk eder. Lanetle kutsama aynı çatı altında barınmaz, kuzum!</p><p>Level atlarsan da Blessed kartın gider. Artık kendi ayakların üzerinde duracak kadar güçlenmişsin demektir, daha ne istiyorsun?</p><p>Bir de unutma evladım, Blessed kartın yalnızca tek bir oyuncuyu etkileyebilir. Herhangi bir etki yüzünden birden fazla oyuncuya etki edecek olursa kart ortadan kalkar.</p><p>Ha, bir de Blessed kartları takas edemezsin! Kısmet dediğin elden ele dolaşmaz.</p><h3>Blessed Kartların Bedeli</h3><p>Blessed kartların Legend Point bedeli yoktur yavrum. Bunlar öyle parayla pulla ölçülmez! O yüzden kartların bedelleriyle etkileşime giren hiçbir kart veya etki, Blessed kartlara işlemez.</p></section><section class="rules-section" id="rules-section-3"><h2>True Words Rules</h2><p>Gel bakalım evladım, sana biraz eski bilgilerden bahsedeyim. True Word dediğin şey Legend kartlarına benzer ama sakın onları kart sanma! Onlar bildiğin kartlardan değildir kuzum, çok daha başka şeylerdir.</p><p>Bu yüzden kartlarına etki eden hiç bir şey True Word&#x27;lerini etkilemez. Ayrıca kart sayısını hesaba katan etkilerde de True Word&#x27;ler sayılmaz.</p><h3>True Word Nasıl Kullanılır?</h3><p>Bak şimdi kuzum, bir True Word öğrendin mi artık senindir. Kullanınca desteye dönmezler. İstediğin kadar kullanırsın, yeter ki bedelini ödeyesin.</p><p>Her True Word&#x27;ün ortasında yazan Legend Point bedelini ödeyerek onu kullanabilirsin</p><p>Amaaa... İşin bir inceliği var evladım! True Word&#x27;ünü savaşın <strong>ilk turunda, kendi sıranda</strong> kullanman gerekir. Kullanırsan etkisi savaşın sonuna kadar sürer.</p><p>İlk turunda kullanmadın mı? Geçmiş olsun kuzum! O savaşta artık kullanamazsın. Demir tavında dövülür, söz de vaktinde söylenir!</p><h3>True Word Nasıl Öğrenilir?</h3><p>Evladım, True Word öğrenmek öyle kitap açıp iki satır okumaya benzemez. Önce bir draft yapacaksın.</p><p>Öğrenmeye karar verdiğinde önüne rastgele üç True Word çıkar. Bunlardan birini seçip öğrenebilirsin. Hiçbiri gönlüne yatmazsa üçünü de es geçebilirsin. Zorla güzellik olmaz kuzum!</p><p>Ama tabii bunun da bir bedeli var. True Word draft etmenin bedeli <strong>1 Legend Point + hâlihazırda bildiğin True Word sayısıdır.</strong></p><p>Yani ne kadar çok bilirsen yenisini öğrenmek o kadar pahalıya gelir. Bilginin de yükü var evladım, boşuna dememişler!</p><h3>True Word Sahipliği</h3><p>Şimdi kuzum, iki farklı oyuncu aynı True Word&#x27;ü öğrenebilir. Bilgi paylaştıkça çoğalır, hemi? Ama bir True Word&#x27;ü öğrendin mi artık unutamazsın! Öyle vazgeçtim, aklımdan sildim demek yok. Bir kere zihnine kazındı mı ömür boyu seninle! Ha, bir de True Word&#x27;ler takas edilemez evladım.</p></section></div></div>`;}

// V2 lookup indexes: avoid repeatedly scanning the entire card collection.
// Rebuild only when an array is replaced or resized (CSV import, undo, restore,

let indexedCards=null,indexedCardCount=-1,cardIndex=new Map();
let indexedPlayers=null,indexedPlayerCount=-1,playerIndex=new Map();
function cardBy(id){
 if(state.cards!==indexedCards||state.cards.length!==indexedCardCount){
  cardIndex=new Map(state.cards.map(c=>[c.id,c]));
  indexedCards=state.cards;indexedCardCount=state.cards.length;
 }
 return cardIndex.get(id)||state.customCards?.find(c=>c.id===id);
}
function playerBy(id){
 if(state.players!==indexedPlayers||state.players.length!==indexedPlayerCount){
  playerIndex=new Map(state.players.map(p=>[p.id,p]));
  indexedPlayers=state.players;indexedPlayerCount=state.players.length;
 }
 return playerIndex.get(id);
}
// Owner index is presentation-only, rebuilt before each full render.
let ownerIndex=new Map();
function rebuildOwnerIndex(){
 ownerIndex=new Map();
 for(const player of state.players){
  const seen=new Set();
  for(const entry of player.hand){
   if(seen.has(entry.cardId))continue;
   seen.add(entry.cardId);
   if(!ownerIndex.has(entry.cardId))ownerIndex.set(entry.cardId,[]);
   ownerIndex.get(entry.cardId).push(player.name);
  }
 }
}

// Official display names are presentation-only. CSV set names, filters, and pack image keys remain unchanged.
const officialSetNames = [
  ['The Overlord of Ashavir', ['ashavir']],
  ['Descent Under Davarron', ['davarron']],
  ['The Godtower', ['godtower']],
  ['The Lost City of Gurgitea', ['gurgitea']],
  ['Throne of Havenholm', ['havenholm']],
  ['Kesqerian Nights', ['kesqer']],
  ['Ragnarök: Nordhallr', ['nordhallr', 'ragnarok', 'ragnarök']],
  ['Pandemonium', ['pandemonium']],

  ['Ballad of Ulagal', ['ulagal']],

function officialSetName(shortName) {
  const key = norm(shortName);
  if(!key) return shortName;
  for(const [official, aliases] of officialSetNames) {
    if(aliases.some(alias => key === norm(alias) || (key.length >= 4 && norm(alias).includes(key)))) return official;
  }
  return shortName;
}

function isPandemoniumSet(value){return norm(value)==='pandemonium'}
const SET_PACK_ORDER=['endisnigh','pentagon','rhodelen','ashavir','kesqer','godtower','davarron','havenholm','ulagal','nordhallr','gurgitea'];
function setPackOrderIndex(v){const n=norm(v);if(n==='theendisnigh'||n==='endisnigh'||n.startsWith('theendisnigh')||n.startsWith('endisnigh'))return 0;const idx=SET_PACK_ORDER.findIndex(key=>n===key||n.startsWith(key));return idx<0?SET_PACK_ORDER.length:idx;}
function compareSetPackOrder(a,b){return setPackOrderIndex(a)-setPackOrderIndex(b)||a.localeCompare(b,'tr');}
function packDefs(){
 let base=state.cards.filter(c=>visibleInLibrary(c)&&!c.cursed);
 let sets=[...new Set(base.map(c=>c.set?.trim()).filter(v=>v&&!isBlessedGroup(v)))].sort(compareSetPackOrder);
 let mechs=[...new Set(base.map(c=>c.mechanicPack?.trim()).filter(v=>v&&!isBlessedGroup(v)))].sort((a,b)=>a.localeCompare(b,'tr'));
 return [
  ...sets.flatMap(v=>isPandemoniumSet(v)?[
   {key:'set:pandemonium:'+v,type:'pandemonium',scope:'set',value:v,title:officialSetName(v)+' Pack'},
   {key:'set:pandecursed:'+v,type:'pandecursed',scope:'set',value:v,title:officialSetName(v)+' Cursed Pack'}
  ]:[
   {key:'set:std:'+v,type:'standard',scope:'set',value:v,title:officialSetName(v)+' Standard Pack'},

   {key:'set:crs:'+v,type:'cursed',scope:'set',value:v,title:officialSetName(v)+' Cursed Pack'}
  ]),
  ...mechs.map(v=>({key:'mechanic:std:'+v,type:'mechanic',scope:'mechanic',value:v,title:v+' Mechanic Pack'})),
  {key:'golden:all',type:'golden',scope:'all',value:'Golden',title:'Golden Pack'},
  {key:'cursedgolden:all',type:'cursedgolden',scope:'all',value:'Cursed Golden',title:'Cursed Golden Pack'}
 ];
}

function openPack(key){
 const d=packDefs().find(d=>d.key===key),p=playerBy(selectedPlayer);
 if(!d||!p)return;
 if(!canOpenPack(d)){toast('Pack için havuzda yeterli uygun kart yok.');return}
 const a=packCandidates(d);let choice;
 if(d.type==='cursed'||d.type==='cursedgolden'||d.type==='pandecursed'){
  const normal=shuffle((d.type==='cursedgolden'||d.type==='pandecursed')?a.filter(c=>isRare(c)&&!isBlessedCard(c)):cursedNormalPool(d)).slice(0,5);
  const cursed=shuffle(cursedPackPool(d))[0];
  if(normal.length!==5||!cursed){toast('Cursed Pack için yeterli kart bulunamadı.');return}
  choice=shuffle([...normal,cursed]);
 }else if(d.type==='pandemonium')choice=shuffle(a.filter(isRare)).slice(0,5);
 else if(d.type==='golden'){
  const blessed=a.filter(isBlessedCard),rares=a.filter(c=>isRare(c)&&!isBlessedCard(c));
  if(blessed.length&&Math.random()<0.02&&rares.length>=4)choice=shuffle([shuffle(blessed)[0],...shuffle(rares).slice(0,4)]);
  else choice=shuffle(rares).slice(0,5);
 }else if(d.type==='premium'){
  const rare=shuffle(a.filter(c=>isRare(c)&&!isBlessedCard(c))).slice(0,1);
  choice=shuffle([...rare,...shuffle(a.filter(c=>!rare.some(r=>r.id===c.id))).slice(0,4)]);
 }else choice=shuffle(a).slice(0,5);
 modal={type:'draw',specific:false,packTitle:d.title,packType:d.type,options:choice.map(c=>c.id),revealed:[],cursedSelectedNormal:null,openingArt:(d.scope==='set'?cardBackArt(d.value):'')||packArt(d)||'',opening:true};render();
}

// ===== CUSTOM CARD DRAFT (v2.2.8) =====
// Custom cards are permanent hand objects, but NOT part of the shared card pool.
// When returned, their unique definition disappears from persistent state.
// Undo history alone retains snapshots until the session ends.
const CUSTOM_TYPES=['Blessed','Caster','Combat','Cursed','Damage','Discard','Draw','Effects','Enhance','Gain','Gold','Held','Reduce','Restore','Roll','Special','TW','XP'];
const CUSTOM_COSTS=[1,3,5];
const customCoverKey=cost=>`custom:cover:${cost}`;
const customEffectKey=(cost,type)=>`custom:effect:${cost}:${norm(type)}`;
const customCoverArt=cost=>packImages.get(customCoverKey(cost))||'';
const customEffectArt=(cost,type)=>packImages.get(customEffectKey(cost,type))||'';
function customEffectDescription(type,cost){const item=state.customEffects.find(e=>norm(e.type)===norm(type)&&Number(e.cost)===Number(cost));return item?.text||''}
async function parseCustomEffectsCSV(file){
 if(!file)return;
 const rows=parseCSV(await file.text());
 if(rows.length<2){toast('Custom effects CSV boş.');return}
 const headers=rows.shift().map(x=>norm(x));
 const nameIdx=headers.indexOf('name');
 const columns=CUSTOM_COSTS.map(cost=>({cost,index:headers.indexOf(norm(`${cost}-cost version`))}));
 if(nameIdx<0||columns.some(col=>col.index<0)){
  alert('Custom Effects CSV sütunları: name, 1-cost version, 3-cost version, 5-cost version');return;
 }
 let updated=0,skipped=0;
 const undo=captureUndo('Custom Card efektleri CSV yükleme');
 for(const row of rows){
  const type=CUSTOM_TYPES.find(t=>norm(t)===norm(row[nameIdx]));
  if(!type){skipped++;continue}
  for(const {cost,index} of columns){
   const description=String(row[index]??'').trim();
   if(!description){skipped++;continue}
   const existing=state.customEffects.find(e=>norm(e.type)===norm(type)&&Number(e.cost)===cost);
   if(existing)existing.text=description;
   else state.customEffects.push({type,cost,text:description});
   updated++;
  }
 }
 if(updated){pushUndo(undo);await save()}
 render();
 toast(`${updated} Custom effect varyantı yüklendi.${skipped?' '+skipped+' boş/geçersiz varyant atlandı.':''}`);
}

function customDraftOptions(draft){
 const used=new Set(draft.picks.map(p=>norm(p.type)));
 const inBonusOneCost=drawBonusOneCostPhase(draft);
 const cost=inBonusOneCost?1:draft.base;
 return CUSTOM_TYPES.filter(type=>!used.has(norm(type))&&customEffectDescription(type,cost)).map(type=>({type,cost}));
}
function drawBonusOneCostPhase(draft){
 return draft.bonus1Remaining>0 && draft.picks.length>=3;
}
function nextCustomOptions(draft){
 const possible=customDraftOptions(draft);
 if(!possible.length){draft.options=[];return false}
 const shuffled=shuffle(possible);
 draft.options=shuffled.slice(0,3);
 return true;
}
function customDraftRequired(draft){return 3+(draft.picks.some(p=>p.type==='Effects')?2:0)+(draft.picks.some(p=>p.type==='Special'&&p.cost===3)?2:0)}
function customDraftStart(cost){
 const p=playerBy(selectedPlayer);if(!p||!CUSTOM_COSTS.includes(cost))return;
 if(!state.customEffects.length){toast('Önce Custom Effects CSV yükle.');return}
 const draft={type:'custom-draft',pid:p.id,base:cost,picks:[],options:[],bonus1Remaining:0,upgradeTarget:null};
 if(!nextCustomOptions(draft)){toast(`${cost}-Cost için uygun efekt bulunamadı.`);return}
 modal=draft;render();
}
function selectCustomEffect(type){
 if(modal?.type!=='custom-draft')return;
 const choice=modal.options.find(o=>o.type===type);if(!choice)return;
 if(modal.picks.some(x=>x.type===type))return;
 const wasBonusPhase=drawBonusOneCostPhase(modal);
 modal.picks.push({...choice});
 if(wasBonusPhase&&modal.bonus1Remaining>0)modal.bonus1Remaining--;
 if(type==='Special'&&choice.cost===3)modal.bonus1Remaining+=2;
 if(modal.picks.length>=customDraftRequired(modal)&&modal.bonus1Remaining===0){
  if(modal.base===1&&modal.picks.some(p=>p.type==='Special'&&p.cost===1)&&!modal.upgradeTarget){
   const eligible=shuffle(modal.picks.filter(x=>x.type!=='Special'&&customEffectDescription(x.type,3)));
   modal.upgradeTarget=eligible[0]?.type||null;
  }
  finishCustomDraft();
  return;
 }
 if(!nextCustomOptions(modal)){
  modal.options=[];modal.insufficient=true;
 }
 render();
}
function customDraftPicksResolved(draft){
 return draft.picks.map(p=>{
  let cost=p.cost;
  if(draft.base===5&&draft.picks.some(x=>x.type==='Special'&&x.cost===5)&&p.type!=='Special')cost=1;
  if(draft.base===1&&draft.picks.some(x=>x.type==='Special'&&x.cost===1)&&draft.upgradeTarget===p.type)cost=3;
  return {type:p.type,cost,text:customEffectDescription(p.type,cost)};
 });
}

async function finishCustomDraft(){
 const d=modal;if(d?.type!=='custom-draft')return;
 const p=playerBy(d.pid);if(!p||d.picks.length<customDraftRequired(d))return;
 const resolved=customDraftPicksResolved(d);
 if(resolved.some(e=>!e.text)){toast('Bazı efektlerin CSV varyantları eksik.');return}
 const undo=captureUndo('Custom Card Draft');pushUndo(undo);
 const cid=id();const card={id:cid,custom:true,name:`${d.base}-Cost Custom Card`,set:'Custom',cost:d.base,rarity:'Custom',mechanicPack:'Custom Draft',cursed:false,effects:resolved,text:resolved.map(e=>`${e.type} (${e.cost}-Cost): ${e.text}`).join('\n\n')};
 state.customCards.push(card);
 const h={id:id(),cardId:cid,order:++state.order,active:false,note:'',costOverride:null};p.hand.push(h);
 logAction(`${p.name}, ${d.base}-Cost Custom Card oluşturdu (${resolved.map(e=>e.type).join(', ')}).`);
 selectedPlayer=p.id;selectedCard=h.id;screen='hands';handTab='cards';modal=null;await save();render();
}

 const missingTrueWordImages=state.trueWords.filter(w=>!packImages.has(trueWordAssetKey(w.name))).map(w=>w.name);

function flipBatch(index){
 if(modal?.type!=='batch-draw')return;
 modal.revealed??=[];
 const firstFlip=!modal.revealed.includes(index);
 if(firstFlip)modal.revealed.push(index);
 modal.focus=index;
 const btn=document.querySelector(`[data-batch-flip="${index}"]`);
 if(!btn)return;
 document.querySelectorAll('.batch-spread-card.current').forEach(x=>x.classList.remove('current'));
 btn.classList.add('current');
 const shell=btn.querySelector('.flip-card-shell');
 if(firstFlip&&shell){shell.classList.add('is-flipped');const c=cardBy(modal.cards[index]);if(c){shell.dataset.preview=c.id;if(isBlessedCard(c))showBlessedShock();}}

function flipPackOption(index){
 if(modal?.type!=='draw'||!modal.packTitle||modal.opening)return;
 modal.revealed??=[];
 const cid=modal.options[index],card=cardBy(cid);
 if(!card)return;
 const allRevealed=modal.options.every((_,i)=>modal.revealed.includes(i));
 // First click always flips. No cards can be claimed until every card is face-up.
 if(!modal.revealed.includes(index)){
  modal.revealed.push(index);
  const btn=document.querySelector(`[data-pack-flip="${index}"]`);
  if(btn){const shell=btn.querySelector('.flip-card-shell');if(shell){shell.classList.add('is-flipped');shell.dataset.preview=card.id;}}
  if(isBlessedCard(card))showBlessedShock();
  if(modal.options.every((_,i)=>modal.revealed.includes(i))){
   document.querySelectorAll('[data-pack-flip]').forEach(el=>el.classList.add('pack-ready'));
  }
  return;
 }
 if(!allRevealed){toast('Önce bütün kartları çevir.');return;}
 if(modal.packType==='cursed'||(modal.packType==='cursedgolden'||modal.packType==='pandecursed')){
  if(card.cursed)return; // Cursed card is mandatory and added automatically with the chosen normal card.
  selectCursedPackNormal(cid);
 }else{
  pendingPackReveal=structuredClone(modal);
  addToHand(cid);
 }

// Layout physical cards in original draw order. Only overlap if the row cannot hold
// normal-width cards; the last card of each row stays inside the available width.
function layoutPhysicalDeck(containerSelector,cardSelector,widthPreference,maxOverlapRatio){
 const deck=document.querySelector(containerSelector);if(!deck)return;
 const cards=Array.from(deck.querySelectorAll(':scope > '+cardSelector));
 if(!cards.length)return;
 const width=Math.max(0,deck.clientWidth-16);if(width<1)return;
 const cardWidth=Math.min(widthPreference,width);
 const count=cards.length;
 const maxOverlap=Math.round(cardWidth*maxOverlapRatio);
 const cols=Math.min(count,Math.max(1,Math.floor((width-maxOverlap)/(cardWidth-maxOverlap))));
 const overlap=cols<=1?0:Math.max(0,Math.min(maxOverlap,(cols*cardWidth-width)/(cols-1)));
 deck.style.setProperty(containerSelector==='.hand'?'--deck-card-width':'--library-card-width',cardWidth+'px');
 for(let i=0;i<count;i++){
  cards[i].style.marginLeft=i%cols===0?'0px':(-overlap)+'px';
  cards[i].style.zIndex=String((i%cols)+1);
 }
}

// Physical-card response: tilt tracks the pointer, and a faint reflected highlight follows it.
// This is purely visual; card selection, hover preview and drag-to-transfer stay untouched.
let tactileCard=null;
function findTactileCard(target){
  const art=target?.closest?.('.card-picture');
  return art && art.closest('.hand-card,.library-card') ? art : null;
}
function resetTactileCard(){
  if(!tactileCard)return;
  tactileCard.classList.remove('card-touch');
  tactileCard.style.removeProperty('--tilt-x');
  tactileCard.style.removeProperty('--tilt-y');
  tactileCard.style.removeProperty('--push-x');
  tactileCard.style.removeProperty('--push-y');
  tactileCard.style.removeProperty('--glint-x');
  tactileCard.style.removeProperty('--glint-y');
  tactileCard=null;
}
document.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'||e.pointerType==='pen'&&e.buttons||dragHand||document.body.classList.contains('dragging-card')){
    resetTactileCard();return;
  }
  const art=findTactileCard(e.target);
  if(art!==tactileCard){resetTactileCard();if(art){tactileCard=art;art.classList.add('card-touch')}}
  if(!art)return;
  const box=art.getBoundingClientRect();
  if(!box.width||!box.height)return;
  const x=Math.max(0,Math.min(1,(e.clientX-box.left)/box.width));
  const y=Math.max(0,Math.min(1,(e.clientY-box.top)/box.height));
  art.style.setProperty('--tilt-x',((.5-y)*5.4).toFixed(2)+'deg');
  art.style.setProperty('--tilt-y',((x-.5)*5.4).toFixed(2)+'deg');
  art.style.setProperty('--push-x',((x-.5)*7).toFixed(2)+'px');
  art.style.setProperty('--push-y',((y-.5)*7).toFixed(2)+'px');
  art.style.setProperty('--glint-x',(x*100).toFixed(1)+'%');
  art.style.setProperty('--glint-y',(y*100).toFixed(1)+'%');
},{passive:true});
document.addEventListener('pointerout',e=>{
  if(tactileCard && tactileCard.contains(e.target) && !tactileCard.contains(e.relatedTarget))resetTactileCard();
});

document.addEventListener('submit',async e=>{if(e.target.id!=='trueWordForm')return;e.preventDefault();const data=new FormData(e.target),name=String(data.get('name')||'').trim(),effect=String(data.get('text')||'').trim();if(!name)return;const existing=state.trueWords.find(w=>norm(w.name)===norm(name)&&w.id!==modal.wordId);if(existing){toast('Bu isimde True Word zaten var.');return}pushUndo(captureUndo('True Word kaydetme'));let w=modal.wordId?trueWordBy(modal.wordId):null;if(w){w.name=name;w.text=effect}else state.trueWords.push({id:id(),name,text:effect});modal=null;await save();render();});
document.addEventListener('submit',async e=>{if(e.target.id!=='cardForm')return;e.preventDefault();let f=e.target,d=new FormData(f);let name=String(d.get('name')||'').trim();if(!name)return;let isCursed=d.has('cursed');let dup=state.cards.find(c=>c.name.toLowerCase()===name.toLowerCase()&&Boolean(c.cursed)===isCursed&&c.id!==modal?.cid);if(dup){alert('Bu isimde kart zaten var.');return}let c=modal?.cid?cardBy(modal.cid):null;const undo=captureUndo(c?'Kart düzenleme':'Yeni kart ekleme');let fimg=d.get('art');if(fimg instanceof File&&fimg.size&&c)await snapshotAsset(undo,'images',c.id);if(!c){c={id:id()};state.cards.push(c)}Object.assign(c,{name,set:String(d.get('set')||''),cost:String(d.get('cost')||''),rarity:String(d.get('rarity')||''),text:String(d.get('text')||''),mechanicPack:String(d.get('mechanicPack')||''),cursed:isCursed});if(fimg instanceof File&&fimg.size){if(!undo.assets.length)await snapshotAsset(undo,'images',c.id);await putImage(c.id,fimg)}pushUndo(undo);modal=null;await save();render();toast('Kart kaydedildi.')});
document.addEventListener('change',async e=>{let t=e.target,p=playerBy(selectedPlayer);if(t.id==='player-note'&&p&&p.notes!==t.value){pushUndo(captureUndo('Oyuncu notu'));p.notes=t.value;await save()}if(t.id==='card-note'&&p){let h=p.hand.find(h=>h.id===selectedCard);if(h&&h.note!==t.value){pushUndo(captureUndo('Kart notu'));h.note=t.value;await save()}}if(t.id==='costOverride'&&p){let h=p.hand.find(h=>h.id===selectedCard);if(h){let next=t.value.trim()===''?null:t.value.trim();if(h.costOverride!==next){pushUndo(captureUndo('Kart cost değişikliği'));h.costOverride=next;await save();render()}}}if(t.id==='shopScope'){shopScope=t.value;shopGroup=null;render()}if(t.id==='setFilter'){filterSet=t.value;render()}if(t.id==='mechanicFilter'){filterMechanic=t.value;render()}if(t.id==='libraryMissingImagesOnly'){libraryMissingImagesOnly=t.checked;render()}if(t.id==='libraryPoolOnly'){libraryPoolOnly=t.checked;render()}});
document.addEventListener('change',e=>{const t=e.target;if(modal?.type==='batch-draw'&&t.matches('[data-draw-filter]')){modal.filters??={};modal.filters[t.dataset.drawFilter]=t.value;const count=document.querySelector('.draw-count');if(count)count.textContent=matchingDrawCards(modal).length+' uygun kart';}});
document.addEventListener('input',e=>{let t=e.target;if(modal?.type==='batch-draw'&&t.matches('[data-draw-filter]')){modal.filters??={};modal.filters[t.dataset.drawFilter]=t.value;const count=document.querySelector('.draw-count');if(count)count.textContent=matchingDrawCards(modal).length+' uygun kart';return}if(t.id==='librarySearch'){let val=t.value;search=val;clearTimeout(librarySearchTimer);librarySearchTimer=setTimeout(()=>{const inp=document.getElementById('librarySearch');const pos=inp?.selectionStart??val.length;const sc=inp?.scrollLeft??0;render();const next=document.getElementById('librarySearch');if(next){next.focus({preventScroll:true});next.setSelectionRange(pos,pos);next.scrollLeft=sc}},170)}if(t.id==='drawSearch'){let q=t.value;let pos=t.selectionStart;specificDraw(q);let inp=document.getElementById('drawSearch');inp?.focus();inp?.setSelectionRange(pos,pos)}});
(async()=>{try{await openDB();selectedPlayer=state.players[0]?.id||null;render()}catch(e){document.getElementById('app').innerHTML=`<div class="panel" style="margin:30px"><h2>Yerel depolama açılamadı</h2><p>${esc(e.message)}</p><p>Dosyayı Chrome veya Edge ile açmayı dene. Tarayıcının özel / gizli modunu kullanma.</p></div>`}})();
</script></body></html>
