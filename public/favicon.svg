<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Legend Cards icon: a gold-framed card with a ✦ in front of a True Word card, on the app's canvas. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2f45" />
      <stop offset="1" stop-color="#131a26" />
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9d777" />
      <stop offset="0.55" stop-color="#e9b94c" />
      <stop offset="1" stop-color="#8d5a17" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffae41" stop-opacity="0.55" />
      <stop offset="1" stop-color="#ffae41" stop-opacity="0" />
