    <circle cx="36" cy="33" r="13" fill="url(#glow)" />
    <path d="M36 21.5 Q37.6 31.4 45.5 33 Q37.6 34.6 36 44.5 Q34.4 34.6 26.5 33 Q34.4 31.4 36 21.5 Z" fill="#f9d777" />
